<!doctype html>
<!--
  Source for the 1200x630 sharing images in /assets/og/. Not a page on the site.
  Serve the repo locally, then render each one with headless Chrome at 1200x630:
    /tools/og-image.html               -> assets/og/whitebox.png      (home page)
    /tools/og-image.html?course=agent  -> assets/og/build-an-ai-agent.png (course, chapters, final project)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  .card { position: relative; display: grid; grid-template-rows: auto 1fr auto; width: 1200px; height: 630px; padding: 56px 64px; border-bottom: 16px solid var(--accent); }
  .card .brand { font-size: 30px; gap: 18px; }
  .card .brand i { width: 36px; height: 36px; border-width: 3px; }
  .card .brand i::after { top: -10px; right: -10px; width: 18px; height: 18px; }
  .middle { align-self: center; }
  .card .eyebrow { font-size: 20px; margin-bottom: 28px; }
  .card .eyebrow::before { width: 16px; height: 16px; }
  .card h1 { font-size: 120px; line-height: 0.92; letter-spacing: -0.045em; }
  .card h1.course { font-size: 92px; }
  .card h1 span { display: inline-block; margin-top: 0.08em; padding: 0.02em 0.16em 0.08em; background: var(--ink); color: var(--paper); transform: rotate(-2deg); }
  .foot { display: flex; justify-content: space-between; align-items: end; font: 500 22px/1.3 var(--mono); color: var(--muted); }
  .foot b { color: var(--ink); font-weight: 700; }
  .equation { position: absolute; top: 64px; right: 64px; padding: 14px 20px; background: var(--ink); color: var(--paper); font: 500 22px var(--mono); box-shadow: 8px 8px 0 var(--accent); }
</style>
</head>
<body>
<div class="card grid-bg">
  <div class="brand"><i></i>Whitebox Academy</div>
  <div class="middle" id="middle"></div>
  <div class="foot" id="foot"></div>
  <div class="equation">agent = model + tools + loop</div>
</div>
<script>
  const course = new URLSearchParams(location.search).get("course") === "agent";
  document.getElementById("middle").innerHTML = course
    ? `<div class="eyebrow">Free course · 35 chapters</div><h1 class="course">Build an AI Agent<br><span>from scratch.</span></h1>`
    : `<div class="eyebrow">Learn how technology really works</div><h1>Open the<br><span>black box.</span></h1>`;
  document.getElementById("foot").innerHTML = course
    ? `<span>Python · your own framework · a coding agent</span><b>whiteboxacademy.in</b>`
    : `<span>Free course: build an AI agent from scratch</span><b>whiteboxacademy.in</b>`;
</script>
</body>
</html>
